<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziad &amp; Shrouk — Wedding Invitation</title>
<meta name="theme-color" content="#f7edda">
<style>
:root{--cream:#f8efdf;--gold:#a87520;--deep:#79501a;--shine:#d7b66b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--deep);font-family:Georgia,'Times New Roman',serif}
#cover{min-height:100svh;display:grid;place-items:center;padding:26px 18px;overflow:hidden;background:radial-gradient(ellipse at center,#fff9ed 0,#f7ebd5 68%,#ead6b1 100%);transition:opacity .8s ease,transform .8s ease}
.envelope{position:relative;width:min(88vw,480px);aspect-ratio:1.18/1;background:linear-gradient(145deg,#fff7e8,#ead5ad);border:1px solid #bd9146;box-shadow:0 20px 55px #74501c30,inset 0 0 0 7px #fff8e8,inset 0 0 0 8px #c39a4f;display:flex;align-items:center;justify-content:center;text-align:center}
.envelope:before,.envelope:after{content:'❧';position:absolute;color:#a8792d;font-size:clamp(34px,8vw,55px);text-shadow:0 1px #fff1c7}.envelope:before{top:9px;left:14px;transform:rotate(-35deg)}.envelope:after{bottom:9px;right:14px;transform:rotate(145deg)}
.flap{position:absolute;z-index:3;inset:0 0 auto;height:57%;transform-origin:top;transition:transform 1s cubic-bezier(.2,.75,.2,1);background:linear-gradient(150deg,#fff8e9,#d9b66e);clip-path:polygon(0 0,100% 0,50% 100%);border:0;filter:drop-shadow(0 4px 3px #76521a25)}
.flap:after{content:'✦';position:absolute;top:24%;left:calc(50% - 13px);font-size:26px;color:#95651e;text-shadow:0 1px #fff1c9}
.seal{position:absolute;z-index:4;top:47%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#e3c77d,#94641e 72%);color:#fff1c7;border:3px double #f6e2a6;box-shadow:0 4px 12px #67441245;font-size:25px;transition:opacity .35s,transform .35s}
.cover-content{position:relative;z-index:2;padding:25px 20px 10px}.eyebrow{letter-spacing:.24em;font-size:10px;text-transform:uppercase;margin-bottom:13px}.cover-content h1{font-size:clamp(30px,7vw,48px);font-style:italic;font-weight:normal;line-height:1.15;margin:0 0 12px;color:#95661f;text-shadow:0 1px #fff5d8}.cover-content p{letter-spacing:.2em;font-size:11px;margin:0 0 22px}.open-btn{position:relative;z-index:5;border:1px solid #f3d99c;border-radius:30px;padding:13px 27px;background:linear-gradient(135deg,#bd8d37,#805219);color:#fff7e7;font:14px Georgia,serif;letter-spacing:.04em;box-shadow:0 4px 12px #79501d30;cursor:pointer}.open-btn:active{transform:scale(.98)}.hint{margin-top:14px;font-size:11px;letter-spacing:.12em;color:#98733c}
body.opened #cover{min-height:0;height:0;padding:0;opacity:0;transform:translateY(-30px);pointer-events:none}body.opened .flap{transform:rotateX(180deg)}body.opened .seal{opacity:0;transform:translate(-50%,-20%) scale(.6)}
#invitation{display:none;max-width:900px;margin:0 auto;opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1s ease}body.opened #invitation{display:block}body.revealed #invitation{opacity:1;transform:translateY(0)}#invitation img{display:block;width:100%;height:auto}
footer{text-align:center;padding:18px;color:#8b6429;font-size:11px;letter-spacing:.13em;background:#f8efdf}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<section id="cover" aria-label="Closed wedding invitation">
 <div class="envelope">
  <div class="cover-content"><div class="eyebrow">You are warmly invited</div><h1>Ziad <span style="font-size:.65em">&amp;</span><br>Shrouk</h1><p>29 OCTOBER 2026 · 8:00 PM</p><button class="open-btn" id="openBtn">Open Invitation&nbsp; ✉</button><div class="hint">A SPECIAL DAY · A BEAUTIFUL BEGINNING</div></div>
  <div class="flap" aria-hidden="true"></div><div class="seal" aria-hidden="true">✦</div>
 </div>
</section>
<main id="invitation" aria-label="Wedding invitation details"><img src="invitation.png" alt="Ziad and Shrouk wedding invitation in an ornate ivory and royal gold floral frame"><footer>WITH LOVE · ZIAD &amp; SHROUK</footer></main>
<script>
document.getElementById('openBtn').addEventListener('click',()=>{
 document.body.classList.add('opened');
 window.setTimeout(()=>{document.body.classList.add('revealed');document.getElementById('invitation').scrollIntoView({behavior:'smooth',block:'start'});},650);
});
</script>
</body></html>
